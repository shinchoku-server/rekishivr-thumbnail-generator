<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>歴史VR サムネ作成ツール</title>
<style>
  :root { --green: #11CC89; --dark: #4C473F; --line: #DAD8D3; --bg: #F5F4F1; --mute: #8A857B; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--dark); font-family: "Hiragino Sans", sans-serif; font-size: 14px; line-height: 1.6; }
  header { background: var(--dark); color: #fff; padding: 12px 24px; border-bottom: 6px solid var(--green); display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; }
  main { display: grid; grid-template-columns: 350px 1fr; gap: 24px; padding: 24px; max-width: 1600px; margin: 0 auto; }
  h2 { margin: 0; font-size: 16px; font-weight: 600; }
  h2 small { font-weight: 400; color: var(--mute); margin-left: 8px; font-size: 13px; }

  .panel { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 20px; align-self: start; position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow: auto; }
  .panel h2 { margin-bottom: 16px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
  .field { display: block; margin-bottom: 16px; }
  .field > span { display: block; font-weight: 600; margin-bottom: 6px; }
  .field small { display: block; color: var(--mute); font-size: 12px; margin-top: 4px; }
  .check { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; cursor: pointer; }
  input[type=text], textarea, select { width: 100%; font: inherit; color: inherit; padding: 9px 10px; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
  textarea { height: 96px; resize: vertical; }
  input[type=range] { width: 100%; accent-color: var(--green); }
  input[type=checkbox], input[type=radio] { accent-color: var(--green); }
  .drop { display: block; border: 2px dashed var(--line); border-radius: 8px; padding: 14px; text-align: center; cursor: pointer; }
  .drop.over { border-color: var(--green); background: #EFFBF6; }
  .drop input { display: none; }
  button { font: inherit; cursor: pointer; border-radius: 6px; border: 1px solid var(--line); background: #fff; color: inherit; padding: 5px 10px; }
  button:disabled { opacity: .35; cursor: default; }
  button.save { background: var(--green); border-color: var(--green); color: #fff; font-weight: 600; padding: 9px 16px; }
  button.mini { font-size: 12px; padding: 3px 8px; margin-top: 6px; }
  .panel .save { width: 100%; margin-top: 4px; }

  .stage section { margin-bottom: 32px; }
  .sechead { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 12px; flex-wrap: wrap; }
  .swatches { display: flex; align-items: center; gap: 12px; }
  .swatches label { display: flex; align-items: center; gap: 5px; cursor: pointer; }
  .swatches i { width: 18px; height: 18px; border-radius: 4px; display: inline-block; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  .card { background: #fff; border: 2px solid var(--line); border-radius: 10px; padding: 10px; cursor: pointer; }
  .card.sel { border-color: var(--green); box-shadow: 0 0 0 3px #11CC8933; }
  .card.off canvas { opacity: .3; }
  .cardhead { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .cardhead span { color: var(--mute); }
  .cardhead .ops { margin-left: auto; display: flex; gap: 4px; }
  .cardhead .ops button { font-size: 12px; padding: 2px 7px; }
  canvas { display: block; width: 100%; height: auto; border: 1px solid var(--line); touch-action: none; }
  .card.sel canvas.movable { cursor: grab; }
  .card.sel canvas.movable:active { cursor: grabbing; }
  .adder { margin-top: 14px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  #blogCard { max-width: 760px; }
  #warn { display: none; background: #FFF3D6; border: 1px solid #FFCA5F; border-radius: 8px; padding: 10px 14px; margin: 16px 24px 0; }
  #ruler { position: absolute; left: -9999px; top: 0; visibility: hidden; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } .panel { position: static; max-height: none; } }
</style>
</head>
<body>
<header>
  <h1>歴史VR サムネ作成ツール</h1>
  <button class="save" id="saveAll">すべて保存（ZIP）</button>
</header>
<div id="warn">このツールは Mac 専用です（Mac 標準のヒラギノ角ゴシックで文字を組みます）。ほかの環境では書体が変わってしまいます。</div>

<main>
  <aside class="panel" id="editor"></aside>

  <div class="stage">
    <section>
      <div class="sechead">
        <h2>SNS投稿<small>1080 × 1080・何枚でも</small></h2>
        <div class="swatches" id="postBar">帯の色</div>
      </div>
      <div class="grid" id="pages"></div>
      <div class="adder" id="adder">ページを追加</div>
    </section>

    <section>
      <div class="sechead">
        <h2>ブログ・CMS用<small>1920 × 1080</small></h2>
        <label class="check" style="margin:0"><input type="checkbox" id="blogOn" checked>ブログ用も作る</label>
      </div>
      <div class="card" id="blogCard"><canvas id="blog" width="1920" height="1080"></canvas></div>
    </section>
  </div>
</main>

<script>
// 和文は Mac 標準のヒラギノ角ゴシック、欧文と「!!」は Helvetica Neue。
// どちらも名前で呼び出すだけで、フォントファイルは同梱しない。
const FONT = { family: "'Helvetica Neue','Hiragino Sans',sans-serif", heavy: 800, bold: 700, medium: 600 };
const TEXT_CSS = `font-family:${FONT.family};font-feature-settings:'palt' 1;white-space:pre`;
const DARK = '#4C473F';
const BAR_COLORS = [['#11CC89', '緑'], ['#4C473F', 'こげ茶'], ['#FFCA5F', '黄']];

// ページの種類。自由にできるのは枚数・順番・種類・文・写真まで。
// 書体・色・帯・余白・文字の大きさの段階はここで固定する。
const TYPES = {
  title:     { name: 'タイトル', fields: ['small', 'big', 'note', 'pos', 'photo', 'veil'] },
  photoText: { name: '写真＋文', fields: ['photo', 'small', 'big'], needsPhoto: true },
  photo:     { name: '写真',     fields: ['photo', 'small', 'big'], needsPhoto: true },
  info:      { name: '項目',     fields: ['heading', 'rows'] },
  logo:      { name: 'ロゴ',     fields: ['note'] },
};

const $ = id => document.getElementById(id);
const ruler = $('rulerText');
ruler.setAttribute('style', TEXT_CSS);

let uid = 0;
function newPage(type, init = {}) {
  return {
    id: ++uid, type, small: '', big: '', note: type === 'logo' ? '詳細は公式ホームページから!!' : '',
    heading: '', rows: '', pos: 'top', bar: '', veil: 60,
    photo: null, zoom: 100, cx: 0.5, cy: 0.5, el: null, token: 0, rect: null, ...init,
  };
}

const post = {
  bar: BAR_COLORS[0][0],
  pages: [newPage('title', { big: '【ノ・マド万博】\nに出展しました!!' }), newPage('logo')],
  blog: { type: 'blog', on: true, same: true, big: '', bar: '', veil: 60, photo: null, zoom: 100, cx: 0.5, cy: 0.5, el: $('blog'), token: 0, rect: null },
};
let selected = post.pages[0];

const LOGO = new Image();
LOGO.src = LOGO_SRC;

// ---------- 文字組み ----------

function textWidth(str, size, weight) {
  ruler.setAttribute('font-size', size);
  ruler.setAttribute('font-weight', weight);
  ruler.textContent = str;
  return ruler.getComputedTextLength();
}

const esc = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const rect = (x, y, w, h, fill) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${fill}"/>`;
const text = (str, x, baseline, size, weight, fill, anchor = 'start', glow = false, extra = '') =>
  `<text x="${x}" y="${baseline}" font-size="${size}" font-weight="${weight}" fill="${fill}" text-anchor="${anchor}"${glow ? ' filter="url(#glow)"' : ''}${extra}>${esc(str)}</text>`;

function frame(w, h, bar, barColor, body) {
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
    <defs><filter id="glow" x="-10%" y="-40%" width="120%" height="180%"><feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#fff" flood-opacity="0.9"/></filter></defs>
    <style>text{${TEXT_CSS}}</style>
    ${rect(0, 0, w, bar, barColor)}${rect(0, h - bar, w, bar, barColor)}${body}</svg>`;
}

// 文字の上下中央からベースラインまでは約0.39em
const baselineFor = (centerY, size) => centerY + size * 0.39;

// 【】で囲んだ部分は反転（こげ茶の箱に白文字）
function parseLine(line) {
  return line.split(/(【[^】]*】)/).filter(Boolean).map(part => {
    const hl = /^【.*】$/.test(part);
    return { t: hl ? part.slice(1, -1) : part, hl };
  }).filter(seg => seg.t);
}
const bigLines = str => str.split('\n').map(l => l.trim()).filter(Boolean).map(parseLine).filter(segs => segs.length);
const plain = str => str.replace(/[【】]/g, '');

// 「小さい前置き → 大きい文 → 小さい補足」を縦に積んだ文字ブロック。
// 行をまるごと【】で囲むと一回り大きい帯になる。幅と高さに収まるまで全体を縮める。
function textBlock(p, { size, maxW, maxH = Infinity }) {
  const lines = bigLines(p.big);
  const small = p.small.trim(), note = p.note.trim();

  const measure = s => {
    const items = [];
    if (small) items.push({ kind: 'plain', str: small, size: Math.round(s * 0.55), weight: FONT.bold, gap: s * 0.22 });
    lines.forEach(segs => {
      const full = segs.length === 1 && segs[0].hl;
      const sz = full ? s * 1.2 : s, pad = sz * 0.065, margin = full ? 0 : sz * 0.05;
      const parts = segs.map(seg => {
        const tw = textWidth(seg.t, sz, seg.hl ? FONT.heavy : FONT.bold);
        return { ...seg, tw, flow: seg.hl ? tw + pad * 2 + margin * 2 : tw };
      });
      items.push({ kind: 'big', parts, size: sz, pad, margin, h: segs.some(seg => seg.hl) ? sz * 1.25 : sz, gap: s * 0.3 });
    });
    if (note) items.push({ kind: 'plain', str: note, size: Math.round(s * 0.46), weight: FONT.medium, gap: 0 });
    items.forEach(it => {
      if (it.kind === 'plain') { it.h = it.size; it.w = textWidth(it.str, it.size, it.weight); }
      else it.w = it.parts.reduce((a, part) => a + part.flow, 0);
    });
    if (items.length) items[items.length - 1].gap = 0;
    return { items, inset: s * 0.07, w: Math.max(0, ...items.map(it => it.w)), h: items.reduce((a, it) => a + it.h + it.gap, 0) };
  };

  let s = size, m = measure(s);
  while (s > 36 && (m.w > maxW || m.h > maxH)) { s -= 2; m = measure(s); }

  return {
    w: m.w, h: m.h,
    draw(x, top, align = 'start', glow = false) {
      let out = '', y = top;
      m.items.forEach(it => {
        const base = baselineFor(y + it.h / 2, it.size);
        // 左揃えのとき、箱で始まらない行は箱の中の文字と頭が揃うよう少し下げる
        const boxed = it.kind === 'big' && it.parts[0].hl;
        let cur = align === 'middle' ? x - it.w / 2 : x + (boxed ? 0 : m.inset);
        if (it.kind === 'plain') {
          out += text(it.str, cur, base, it.size, it.weight, DARK, 'start', glow);
        } else {
          it.parts.forEach(part => {
            if (part.hl) {
              out += rect(cur + it.margin, y, part.tw + it.pad * 2, it.h, DARK)
                + text(part.t, cur + it.margin + it.pad, base, it.size, FONT.heavy, '#fff');
            } else {
              out += text(part.t, cur, base, it.size, FONT.bold, DARK, 'start', glow);
            }
            cur += part.flow;
          });
        }
        y += it.h + it.gap;
      });
      return out;
    },
  };
}

// ---------- ページごとの組み方 ----------
// 戻り値: svg（帯と文字）, photoRect（写真を置く範囲）, veil（白ぼかしを掛けるか）, image（固定画像）

const BUILD = {
  title(p, bar) {
    const blk = textBlock(p, { size: 90, maxW: 900, maxH: 760 });
    const top = p.pos === 'bottom' ? 1080 - 40 - 110 - blk.h : 174;
    return { photoRect: [0, 0, 1080, 1080], veil: true, svg: frame(1080, 1080, 40, bar, blk.draw(90, top, 'start', !!p.photo)) };
  },

  // 上に写真、下の白地に文
  photoText(p, bar) {
    const blk = textBlock(p, { size: 84, maxW: 900, maxH: 360 });
    return { photoRect: [0, 40, 1080, 560], svg: frame(1080, 1080, 40, bar, blk.draw(90, 600 + (440 - blk.h) / 2)) };
  },

  // 写真を全面に。文を入れると上に白い帯が付く
  photo(p, bar) {
    let body = '';
    if (p.small.trim() || p.big.trim()) {
      const blk = textBlock(p, { size: 76, maxW: 960, maxH: 320 });
      body = rect(0, 97, 1080, blk.h + 56, '#fff') + blk.draw(54, 97 + 28);
    }
    return { photoRect: [0, 40, 1080, 1000], svg: frame(1080, 1080, 40, bar, body) };
  },

  // 見出し＋「ラベル：内容」の表
  info(p, bar) {
    const rows = parseRows(p.rows);
    const n = rows.reduce((a, r) => a + r.lines.length, 0);
    const pitch = Math.min(80.5, 640 / Math.max(n, 1)), k = pitch / 80.5;
    let vs = 40 * k;
    const valueLines = rows.flatMap(r => r.lines);
    while (vs > 20 && Math.max(0, ...valueLines.map(l => textWidth(l, vs, FONT.medium))) > 600) vs -= 1;
    const ls = Math.min(30 * k, vs);

    let body = '';
    if (p.heading.trim()) body += text(p.heading.trim(), 540, baselineFor(183.5, 72), 72, FONT.bold, DARK, 'middle');
    let i = 0;
    rows.forEach(r => {
      if (r.label) {
        // ラベルは 157px の欄に均等割り付け
        const spread = r.label.length > 1 && textWidth(r.label, ls, FONT.bold) < 157 ? ' textLength="157" lengthAdjust="spacing"' : '';
        body += text(r.label, 141, baselineFor(330 + i * pitch, ls), ls, FONT.bold, DARK, 'start', false, spread);
      }
      r.lines.forEach(l => { body += text(l, 387, baselineFor(330 + i * pitch, vs), vs, FONT.medium, DARK); i++; });
    });
    return { svg: frame(1080, 1080, 40, bar, body) };
  },

  logo(p, bar) {
    const note = p.note.trim();
    return {
      image: { img: LOGO, x: 166, y: 314, w: 748, h: 296 },
      svg: frame(1080, 1080, 40, bar, note ? text(note, 540, baselineFor(664.5, 43), 43, FONT.bold, DARK, 'middle') : ''),
    };
  },

  blog(b, bar) {
    const src = blogSource();
    const whole = plain(bigLines(src.big).map(segs => segs.map(seg => seg.t).join('')).join(''));
    let body = '';
    if (whole && textWidth(whole, 84, FONT.heavy) <= 1560) {
      // 1行に収まるなら全幅の帯にまとめる
      let size = 112;
      while (size > 84 && textWidth(whole, size, FONT.heavy) > 1560) size -= 2;
      body = rect(140, 462, 1640, 150, DARK) + text(whole, 960, baselineFor(537, size), size, FONT.heavy, '#fff', 'middle');
    } else if (whole) {
      const blk = textBlock({ small: '', big: src.big, note: '' }, { size: 100, maxW: 1640, maxH: 760 });
      body = blk.draw(960, 540 - blk.h / 2, 'middle', !!photoOf(b));
    }
    return { photoRect: [0, 0, 1920, 1080], veil: true, svg: frame(1920, 1080, 80, bar, body) };
  },
};

function parseRows(str) {
  const rows = [];
  str.split('\n').map(l => l.trim()).filter(Boolean).forEach(line => {
    // 「ラベル：内容」。時刻の 14:00 などを区切りと誤解しないよう、ラベルは数字なしの8文字まで
    const m = line.match(/^([^：:]{1,8})[：:]\s*(.*)$/);
    if (m && !/\d/.test(m[1])) rows.push({ label: m[1].trim(), lines: [m[2]] });
    else if (rows.length) rows[rows.length - 1].lines.push(line);
    else rows.push({ label: '', lines: [line] });
  });
  return rows;
}

// ブログ用は既定で「文のある最初のページ」と同じ文・写真を使う
const firstTextPage = () => post.pages.find(p => p.big.trim()) || null;
const blogSource = () => (post.blog.same && firstTextPage()) || post.blog;
const photoOf = item => (item.type === 'blog' ? blogSource().photo : item.photo);

// ---------- 描画 ----------

function loadImage(url) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = url;
  });
}

function coverRect(item, ph, w, h) {
  const scale = Math.max(w / ph.naturalWidth, h / ph.naturalHeight) * item.zoom / 100;
  const dw = ph.naturalWidth * scale, dh = ph.naturalHeight * scale;
  return { x: (w - dw) * item.cx, y: (h - dh) * item.cy, w: dw, h: dh };
}

async function render(item) {
  const token = ++item.token;
  const lay = BUILD[item.type](item, item.bar || post.bar);
  const url = URL.createObjectURL(new Blob([lay.svg], { type: 'image/svg+xml' }));
  const overlay = await loadImage(url);
  URL.revokeObjectURL(url);
  if (lay.image && !lay.image.img.complete) await lay.image.img.decode();
  if (token !== item.token) return;

  const c = item.el, ctx = c.getContext('2d'), ph = photoOf(item);
  item.rect = lay.photoRect || null;
  c.classList.toggle('movable', !!(ph && lay.photoRect));
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, c.width, c.height);
  if (lay.photoRect) {
    const [x, y, w, h] = lay.photoRect;
    ctx.save();
    ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
    if (ph) {
      const r = coverRect(item, ph, w, h);
      ctx.drawImage(ph, x + r.x, y + r.y, r.w, r.h);
      if (lay.veil) { ctx.fillStyle = `rgba(255,255,255,${item.veil / 100})`; ctx.fillRect(x, y, w, h); }
    } else if (!lay.veil) {
      // 写真が必須のページでまだ入っていないとき
      ctx.fillStyle = '#ECEAE5'; ctx.fillRect(x, y, w, h);
      ctx.fillStyle = '#A9A49A'; ctx.font = "600 44px 'Hiragino Sans'"; ctx.textAlign = 'center';
      ctx.fillText('写真を入れてください', x + w / 2, y + h / 2);
    }
    ctx.restore();
  }
  if (lay.image) ctx.drawImage(lay.image.img, lay.image.x, lay.image.y, lay.image.w, lay.image.h);
  ctx.drawImage(overlay, 0, 0, c.width, c.height);
}

const renderAll = () => Promise.all([...post.pages, post.blog].map(render));

// 編集中のページと、それを写しているブログ用だけ描き直す
function refresh() {
  render(selected);
  if (selected !== post.blog) render(post.blog);
}

// ---------- ページ一覧 ----------

function attachDrag(item) {
  let last = null;
  item.el.addEventListener('pointerdown', e => {
    if (item !== selected || !photoOf(item) || !item.rect) return;
    last = e;
    item.el.setPointerCapture(e.pointerId);
  });
  item.el.addEventListener('pointermove', e => {
    if (!last) return;
    const k = item.el.width / item.el.clientWidth, [, , w, h] = item.rect;
    const r = coverRect(item, photoOf(item), w, h);
    if (r.w > w) item.cx = Math.min(1, Math.max(0, item.cx - (e.clientX - last.clientX) * k / (r.w - w)));
    if (r.h > h) item.cy = Math.min(1, Math.max(0, item.cy - (e.clientY - last.clientY) * k / (r.h - h)));
    last = e;
    render(item);
  });
  ['pointerup', 'pointercancel'].forEach(t => item.el.addEventListener(t, () => { last = null; }));
}

function rebuildPages() {
  const wrap = $('pages');
  wrap.textContent = '';
  post.pages.forEach((p, i) => {
    if (!p.el) {
      p.el = document.createElement('canvas');
      p.el.width = p.el.height = 1080;
      attachDrag(p);
      render(p);
    }
    const card = document.createElement('div');
    card.className = 'card' + (p === selected ? ' sel' : '');
    card.innerHTML = `<div class="cardhead"><b>${i + 1}枚目</b><span>${TYPES[p.type].name}</span>
      <span class="ops"><button data-op="left" title="前へ"${i === 0 ? ' disabled' : ''}>←</button><button data-op="right" title="後ろへ"${i === post.pages.length - 1 ? ' disabled' : ''}>→</button><button data-op="dup">複製</button><button data-op="del"${post.pages.length === 1 ? ' disabled' : ''}>削除</button></span></div>`;
    card.appendChild(p.el);
    card.addEventListener('click', e => {
      const op = e.target.dataset.op;
      if (op) pageOp(p, op); else select(p);
    });
    wrap.appendChild(card);
  });
  $('blogCard').className = 'card' + (selected === post.blog ? ' sel' : '') + (post.blog.on ? '' : ' off');
}

function pageOp(p, op) {
  const i = post.pages.indexOf(p);
  if (op === 'left' || op === 'right') {
    const j = i + (op === 'left' ? -1 : 1);
    [post.pages[i], post.pages[j]] = [post.pages[j], post.pages[i]];
  } else if (op === 'dup') {
    const copy = newPage(p.type, { ...p, id: ++uid, el: null, token: 0 });
    post.pages.splice(i + 1, 0, copy);
    selected = copy;
  } else if (op === 'del') {
    post.pages.splice(i, 1);
    if (selected === p) selected = post.pages[Math.min(i, post.pages.length - 1)];
  }
  rebuildPages();
  buildEditor();
  render(post.blog);
}

function select(item) {
  if (selected === item) return;
  selected = item;
  rebuildPages();
  buildEditor();
}

// ---------- 編集欄 ----------

function buildEditor() {
  const it = selected, isBlog = it.type === 'blog';
  const fields = isBlog ? (it.same ? ['veil'] : ['big', 'photo', 'veil']) : TYPES[it.type].fields;
  const has = k => fields.includes(k);
  const ph = photoOf(it);
  const idx = post.pages.indexOf(it);
  const file = isBlog ? 'blog_thumbnail.png' : `square_${idx + 1}.png`;

  let h = `<h2>${isBlog ? 'ブログ・CMS用' : `${idx + 1}枚目<small>${TYPES[it.type].name}</small>`}</h2>`;
  if (isBlog) h += `<label class="check"><input type="checkbox" data-k="same">SNSの最初の文と写真を使う</label>`;
  if (has('heading')) h += `<label class="field"><span>見出し</span><input type="text" data-k="heading" placeholder="会社概要"></label>`;
  if (has('rows')) h += `<label class="field"><span>項目</span><textarea data-k="rows" style="height:180px" placeholder="商号：合同会社歴史VR&#10;設立年月日：2026年7月16日"></textarea><small>1行に「ラベル：内容」。コロンのない行は前の行の続きになります。</small></label>`;
  if (has('small')) h += `<label class="field"><span>小さい前置き</span><input type="text" data-k="small" placeholder="一橋大学アクセラレータプログラム"></label>`;
  if (has('big')) h += `<div class="field"><span>大きい文</span><textarea data-k="big" id="bigText"></textarea><button type="button" class="mini" id="wrapHl">選んだ文字を【反転】にする</button><small>【】で囲むと反転します。1行まるごと囲むと大きい帯になります。長いと自動で小さくなります。</small></div>`;
  if (has('note')) h += `<label class="field"><span>小さい補足</span><input type="text" data-k="note"></label>`;
  if (has('pos')) h += `<label class="field"><span>文字の位置</span><select data-k="pos"><option value="top">上</option><option value="bottom">下</option></select></label>`;
  if (has('photo')) h += `<div class="field"><span>写真</span><label class="drop" id="drop">ここに写真をドロップ、またはクリックして選ぶ<input type="file" id="photo" accept="image/*"></label>${it.photo ? '<button type="button" class="mini" id="clearPhoto">写真を外す</button>' : ''}</div>`;
  if (ph && TYPES[it.type]?.fields.includes('photo') || (isBlog && ph)) h += `<label class="field"><span>写真の拡大</span><input type="range" data-k="zoom" min="100" max="300"><small>位置はプレビューをドラッグして動かせます。</small></label>`;
  if (has('veil') && ph) h += `<label class="field"><span>写真の白ぼかし</span><input type="range" data-k="veil" min="0" max="90"><small>文字が読みにくいときは右へ。</small></label>`;
  h += `<label class="field"><span>帯の色</span><select data-k="bar"><option value="">${isBlog ? 'SNS投稿と同じ' : '投稿全体と同じ'}</option>${BAR_COLORS.map(([v, n]) => `<option value="${v}">${n}</option>`).join('')}</select></label>`;
  h += `<button class="save" id="saveOne">${file} を保存</button>`;
  $('editor').innerHTML = h;

  $('editor').querySelectorAll('[data-k]').forEach(el => {
    const k = el.dataset.k;
    if (el.type === 'checkbox') el.checked = it[k]; else el.value = it[k];
    el.addEventListener('input', () => {
      it[k] = el.type === 'checkbox' ? el.checked : el.type === 'range' ? Number(el.value) : el.value;
      refresh();
      if (el.type === 'checkbox') buildEditor();
    });
  });

  $('wrapHl')?.addEventListener('click', () => {
    const ta = $('bigText'), a = ta.selectionStart, b = ta.selectionEnd;
    if (a === b) return;
    ta.setRangeText(`【${ta.value.slice(a, b)}】`, a, b, 'end');
    ta.dispatchEvent(new Event('input'));
    ta.focus();
  });

  const drop = $('drop');
  if (drop) {
    $('photo').addEventListener('change', e => setPhoto(it, e.target.files[0]));
    ['dragenter', 'dragover'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add('over'); }));
    ['dragleave', 'drop'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove('over'); }));
    drop.addEventListener('drop', e => setPhoto(it, e.dataTransfer.files[0]));
  }
  $('clearPhoto')?.addEventListener('click', () => { it.photo = null; buildEditor(); refresh(); });
  $('saveOne').addEventListener('click', async () => {
    if (!checkPhotos([it])) return;
    await render(it);
    download(await pngBlob(it), file);
  });
}

async function setPhoto(item, file) {
  if (!file) return;
  const url = URL.createObjectURL(file);
  try {
    item.photo = await loadImage(url);
  } catch {
    alert('この画像は読み込めませんでした。JPEG か PNG で試してください。');
    return;
  }
  item.zoom = 100; item.cx = item.cy = 0.5;
  buildEditor();
  refresh();
}

// ---------- 保存 ----------

const pngBlob = item => new Promise(resolve => item.el.toBlob(resolve, 'image/png'));

function download(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function checkPhotos(items) {
  const missing = items.filter(p => TYPES[p.type]?.needsPhoto && !p.photo).map(p => `${post.pages.indexOf(p) + 1}枚目`);
  if (missing.length) alert(`${missing.join('、')}に写真が入っていません。`);
  return !missing.length;
}

const CRC_TABLE = Uint32Array.from({ length: 256 }, (_, n) => {
  for (let k = 0; k < 8; k++) n = n & 1 ? 0xEDB88320 ^ (n >>> 1) : n >>> 1;
  return n >>> 0;
});
function crc32(bytes) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

// 無圧縮のZIP。PNGはすでに圧縮済みなので格納するだけで足りる
function zip(files) {
  const now = new Date();
  const time = (now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1);
  const date = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
  const enc = new TextEncoder(), parts = [], central = [];
  let offset = 0;
  files.forEach(f => {
    const name = enc.encode(f.name), crc = crc32(f.data), n = f.data.length;
    const local = new DataView(new ArrayBuffer(30));
    local.setUint32(0, 0x04034b50, true); local.setUint16(4, 20, true);
    local.setUint16(10, time, true); local.setUint16(12, date, true);
    local.setUint32(14, crc, true); local.setUint32(18, n, true); local.setUint32(22, n, true);
    local.setUint16(26, name.length, true);
    parts.push(local, name, f.data);
    const cd = new DataView(new ArrayBuffer(46));
    cd.setUint32(0, 0x02014b50, true); cd.setUint16(4, 20, true); cd.setUint16(6, 20, true);
    cd.setUint16(12, time, true); cd.setUint16(14, date, true);
    cd.setUint32(16, crc, true); cd.setUint32(20, n, true); cd.setUint32(24, n, true);
    cd.setUint16(28, name.length, true); cd.setUint32(42, offset, true);
    central.push(cd, name);
    offset += 30 + name.length + n;
  });
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true);
  end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
  end.setUint32(12, central.reduce((a, part) => a + part.byteLength, 0), true);
  end.setUint32(16, offset, true);
  return new Blob([...parts, ...central, end], { type: 'application/zip' });
}

async function saveAll() {
  if (!checkPhotos(post.pages)) return;
  const items = post.blog.on ? [...post.pages, post.blog] : post.pages;
  await Promise.all(items.map(render));
  const files = [];
  for (const it of items) {
    const name = it.type === 'blog' ? 'blog_thumbnail.png' : `square_${post.pages.indexOf(it) + 1}.png`;
    files.push({ name, data: new Uint8Array(await (await pngBlob(it)).arrayBuffer()) });
  }
  const d = new Date(), stamp = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
  download(zip(files), `thumbnails_${stamp}.zip`);
}

// ---------- 起動 ----------

$('postBar').insertAdjacentHTML('beforeend', BAR_COLORS.map(([v, n], i) =>
  `<label><input type="radio" name="postBar" value="${v}"${i === 0 ? ' checked' : ''}><i style="background:${v}"></i>${n}</label>`).join(''));
$('postBar').addEventListener('change', e => { post.bar = e.target.value; renderAll(); });

$('adder').insertAdjacentHTML('beforeend', Object.entries(TYPES).map(([k, t]) => `<button data-add="${k}">＋${t.name}</button>`).join(''));
$('adder').addEventListener('click', e => {
  const type = e.target.dataset.add;
  if (!type) return;
  // ロゴは締めなので、その手前に差し込む
  const last = post.pages[post.pages.length - 1];
  const at = type !== 'logo' && last?.type === 'logo' ? post.pages.length - 1 : post.pages.length;
  const p = newPage(type);
  post.pages.splice(at, 0, p);
  selected = p;
  rebuildPages();
  buildEditor();
});

attachDrag(post.blog);
$('blogCard').addEventListener('click', () => select(post.blog));
$('blogOn').addEventListener('click', e => e.stopPropagation());
$('blogOn').addEventListener('change', e => { post.blog.on = e.target.checked; rebuildPages(); });
$('saveAll').addEventListener('click', saveAll);

if (!/Mac/.test(navigator.platform)) $('warn').style.display = 'block';
rebuildPages();
buildEditor();
render(post.blog);
</script>
</body>
</html>
